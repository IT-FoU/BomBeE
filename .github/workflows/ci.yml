name: CI

on:
  push:
    branches: [main, 'cursor/**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install (lockfile frozen)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit / package tests
        run: pnpm test

      - name: Production build
        run: pnpm build
        env:
          APP_ENV: local
          PUBLIC_API_URL: http://localhost:8787
          PUBLIC_CUSTOMER_URL: http://localhost:5173
          PUBLIC_BACKOFFICE_URL: http://localhost:5174
          EGO_POS_ENABLED: 'false'

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: quality-failure-logs
          path: |
            **/coverage/**
            **/test-results/**
            **/playwright-report/**
          if-no-files-found: ignore

  dependency-scan:
    name: Dependency / security scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install (lockfile frozen)
        run: pnpm install --frozen-lockfile

      - name: pnpm audit (fail on high+)
        run: |
          pnpm config set fetch-retries 5
          pnpm config set fetch-retry-maxtimeout 120000
          pnpm config set fetch-timeout 120000
          attempt=1
          max_attempts=5
          while [ "$attempt" -le "$max_attempts" ]; do
            echo "pnpm audit attempt ${attempt}/${max_attempts}"
            if pnpm audit --audit-level=high; then
              exit 0
            fi
            status=$?
            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "pnpm audit failed after ${max_attempts} attempts (exit ${status})"
              exit "$status"
            fi
            sleep $((attempt * 20))
            attempt=$((attempt + 1))
          done

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  migration-validate:
    name: Migration validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate migration layout
        run: bash scripts/validate-migrations.sh
