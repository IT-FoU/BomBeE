# Local Postgres for BomBee Market (optional)
# Use on a machine with Docker. Cloud agents without Docker can keep using PGlite tests.
#
#   docker compose up -d
#   DATABASE_URL=postgresql://bombee:bombee@127.0.0.1:54322/bombee pnpm db:migrate
#   docker compose down

services:
  db:
    image: postgres:15-alpine
    container_name: bombee-local-db
    restart: unless-stopped
    ports:
      - '54322:5432'
    environment:
      POSTGRES_USER: bombee
      POSTGRES_PASSWORD: bombee
      POSTGRES_DB: bombee
    volumes:
      - bombee_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bombee -d bombee']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bombee_pg_data:
