openapi: 3.0.3
info:
  title: BomBee Market API
  version: 0.12.0
  description: Phase 2 partial OpenAPI — auth + health. Expand as HTTP surface grows.
servers:
  - url: http://localhost:8787
    description: Local mock (PGlite + mock SMS)
paths:
  /health:
    get:
      summary: Health
      responses:
        '200':
          description: OK
  /v1/auth/capabilities:
    get:
      summary: Auth capability flags
      responses:
        '200':
          description: Capability document
  /v1/auth/otp/request:
    post:
      summary: Request SMS OTP (mock SMS in local)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phoneE164]
              properties:
                phoneE164:
                  type: string
                  example: '+8562012345678'
                purpose:
                  type: string
                  enum: [customer_login, staff_login]
                inviteCode:
                  type: string
                  description: Required when INVITE_ONLY_ENABLED=true
      responses:
        '200':
          description: Accepted (anti-enumeration). Local mock may include devCode.
        '400':
          description: Invalid phone
        '403':
          description: Invite required/invalid
  /v1/auth/otp/verify:
    post:
      summary: Verify OTP and create session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phoneE164, code]
              properties:
                phoneE164:
                  type: string
                code:
                  type: string
                purpose:
                  type: string
                  enum: [customer_login, staff_login]
                inviteCode:
                  type: string
                  description: Required when INVITE_ONLY_ENABLED; redeems invite on success
      responses:
        '200':
          description: Session issued
        '401':
          description: Invalid/expired OTP
        '403':
          description: Invite required/invalid
  /v1/auth/me:
    get:
      summary: Current session profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Session + identity summary
        '401':
          description: Missing or invalid session
  /v1/auth/logout:
    post:
      summary: Revoke session
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                sessionToken:
                  type: string
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Session revoked
        '400':
          description: Missing token
  /v1/invites:
    get:
      summary: List beta invites (local ops)
      responses:
        '200':
          description: Invite rows
    post:
      summary: Create beta invite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inviteCode]
              properties:
                inviteCode:
                  type: string
                intendedRole:
                  type: string
                  enum: [customer, store_owner, ops, admin]
                maxUses:
                  type: integer
                note:
                  type: string
                phoneE164:
                  type: string
      responses:
        '201':
          description: Invite created
        '400':
          description: Invalid payload
        '409':
          description: Code taken
  /v1/stores:
    get:
      summary: List stores (local ops)
      responses:
        '200':
          description: Store rows
    post:
      summary: Create store draft (onboarding)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                code:
                  type: string
      responses:
        '201':
          description: Store created
        '400':
          description: Invalid payload
        '409':
          description: Code taken
  /v1/stores/quality:
    get:
      summary: List quality events and suspensions
      parameters:
        - in: query
          name: storeId
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
      responses:
        '200':
          description: Events and suspensions
  /v1/ops/stores/quality/mock-event:
    post:
      summary: Local/mock record quality event(s)
      responses:
        '201':
          description: Event(s) recorded
        '403':
          description: Mock ops disabled
  /v1/ops/stores/{storeId}/reactivate:
    post:
      summary: Reactivate suspended store with evidence
      parameters:
        - in: path
          name: storeId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Store active
        '403':
          description: Mock ops disabled
  /v1/catalog/categories:
    get:
      summary: List non-prohibited categories
      responses:
        '200':
          description: Category rows
  /v1/catalog/products:
    get:
      summary: List active products with approved prices
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            maximum: 100
      responses:
        '200':
          description: Product browse DTOs (includes availableQty from local stock seed)
  /v1/inventory/stock:
    get:
      summary: Stock balances for a variant
      parameters:
        - in: query
          name: variantId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: availableQty + balances
        '400':
          description: Missing variantId
  /v1/carts:
    post:
      summary: Create cart for customer session
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Cart created
        '401':
          description: Unauthorized
  /v1/carts/{cartId}/items:
    post:
      summary: Upsert cart line
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: cartId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [storeId, variantId, quantity]
              properties:
                storeId:
                  type: string
                variantId:
                  type: string
                quantity:
                  type: integer
      responses:
        '200':
          description: Line upserted
        '400':
          description: Invalid line
        '403':
          description: Cart not owned
  /v1/carts/{cartId}/checkout:
    post:
      summary: Checkout cart into parent/child orders (optional promoCode)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: cartId
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                shippingLakByStore:
                  type: object
                  additionalProperties:
                    type: integer
                promoCode:
                  type: string
                  description: Active percent-off promo code (local seed LOCAL10)
      responses:
        '201':
          description: Order created (includes promo summary when applied)
        '404':
          description: Promo code not found
        '409':
          description: Domain conflict (empty cart, inactive promo, cap exceeded, …)
  /v1/orders:
    get:
      summary: List recent parent orders with child summaries (local ops)
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Orders array
  /v1/ops/orders/{parentId}/confirm-children:
    post:
      summary: Local ops supplier confirm (no customer session)
      parameters:
        - in: path
          name: parentId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Confirmed child ids + refreshed orders list
        '403':
          description: Mock ops disabled
  /v1/ops/orders/{parentId}/fulfillment/mock-advance:
    post:
      summary: Local ops advance to in_transit
      parameters:
        - in: path
          name: parentId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Advance steps + orders list
  /v1/ops/orders/{parentId}/fulfillment/mock-deliver:
    post:
      summary: Local ops POD deliver
      parameters:
        - in: path
          name: parentId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deliver steps + orders list
  /v1/settlements:
    get:
      summary: List settlement batches (local ops)
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Batches array
  /v1/ops/settlements/mock-create:
    post:
      summary: Local/mock draft settlement batch for delivered+paid children
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                store_id:
                  type: string
      responses:
        '201':
          description: Draft batch created
        '403':
          description: Mock ops disabled
        '409':
          description: No eligible orders or payout missing/on hold
  /v1/settlements/{batchId}/lines:
    get:
      summary: Settlement lines for a batch
      parameters:
        - in: path
          name: batchId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Lines array
        '404':
          description: Batch not found
  /v1/ops/settlements/{batchId}/submit:
    post:
      summary: Local/mock submit draft batch for approval
      parameters:
        - in: path
          name: batchId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Status pending_approval
        '409':
          description: Batch not submittable
  /v1/ops/settlements/{batchId}/approve:
    post:
      summary: Local/mock approve batch (distinct finance actor)
      parameters:
        - in: path
          name: batchId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Status approved
        '409':
          description: Self-approval denied or not approvable
  /v1/ops/settlements/{batchId}/dispute:
    post:
      summary: Local/mock dispute a settlement line
      parameters:
        - in: path
          name: batchId
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                child_order_id:
                  type: string
                reason:
                  type: string
      responses:
        '200':
          description: Line disputed; batch partially_disputed
        '409':
          description: Dispute window exceeded
  /v1/support/tickets:
    get:
      summary: List support tickets (local ops)
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Tickets array
  /v1/me/support/tickets:
    get:
      summary: List own support tickets
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Tickets array
        '401':
          description: Unauthorized
    post:
      summary: Open support ticket
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Ticket opened
        '401':
          description: Unauthorized
  /v1/me/support/tickets/{ticketId}/confirm-close:
    post:
      summary: Customer confirm-close after preliminary resolve
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: ticketId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Closed
        '401':
          description: Unauthorized
        '403':
          description: Not ticket owner
  /v1/ops/support/tickets/mock-create:
    post:
      summary: Local/mock open a support ticket
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                subject:
                  type: string
                body:
                  type: string
                urgency:
                  type: string
                  enum: [general, urgent]
      responses:
        '201':
          description: Ticket opened
        '403':
          description: Mock ops disabled
  /v1/ops/support/tickets/{ticketId}/reply:
    post:
      summary: Local/mock staff reply
      parameters:
        - in: path
          name: ticketId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body:
                  type: string
      responses:
        '200':
          description: Status awaiting_customer
        '404':
          description: Ticket not found
  /v1/ops/support/tickets/{ticketId}/resolve:
    post:
      summary: Local/mock preliminary resolve
      parameters:
        - in: path
          name: ticketId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Status resolved_pending_confirm
        '404':
          description: Ticket not found
  /v1/returns:
    get:
      summary: List return requests (local ops)
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Returns array
  /v1/me/returns:
    get:
      summary: List own return requests
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Returns array
        '401':
          description: Unauthorized
    post:
      summary: Request return for owned delivered child
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Return request created
        '401':
          description: Unauthorized
        '403':
          description: Not order owner
        '409':
          description: Not delivered or window/reason ineligible
  /v1/ops/returns/mock-create:
    post:
      summary: Local/mock return for a delivered child
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                child_order_id:
                  type: string
                reason:
                  type: string
      responses:
        '201':
          description: Return request created
        '409':
          description: No eligible delivered child or ineligible reason/window
  /v1/ops/returns/{returnRequestId}/approve:
    post:
      summary: Local/mock approve pending return
      parameters:
        - in: path
          name: returnRequestId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Status approved
        '409':
          description: Return not pending
  /v1/promotions:
    get:
      summary: List promotions (local ops)
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Promotions array
  /v1/recalls:
    get:
      summary: List product recalls (local ops)
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Recalls array
  /v1/ops/recalls/mock-start:
    post:
      summary: Local/mock start product recall
      responses:
        '201':
          description: Recall started
        '403':
          description: Mock ops disabled
  /v1/ops/recalls/{recallId}/contact:
    post:
      summary: Contact affected order and maybe complete recall
      parameters:
        - in: path
          name: recallId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Contact recorded
        '403':
          description: Mock ops disabled
  /v1/ops/promotions/mock-create:
    post:
      summary: Local/mock create active promotion
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                title_en:
                  type: string
                title_lo:
                  type: string
                percent_off:
                  type: integer
                amount_off_lak:
                  type: integer
                funding:
                  type: string
                budget_lak:
                  type: integer
      responses:
        '201':
          description: Promotion created
        '403':
          description: Mock ops disabled
  /v1/ops/promotions/{promotionId}/pause:
    post:
      summary: Local/mock pause active promotion
      parameters:
        - in: path
          name: promotionId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Status paused
        '409':
          description: Promotion not active
  /v1/refunds:
    get:
      summary: List refund approvals (local ops)
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Refunds array
  /v1/ops/refunds/mock-create:
    post:
      summary: Local/mock refund request for paid delivered child
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                child_order_id:
                  type: string
                amount_lak:
                  type: integer
                reason:
                  type: string
      responses:
        '201':
          description: Refund approval created
        '409':
          description: No eligible child
  /v1/ops/refunds/{approvalId}/approve:
    post:
      summary: Local/mock approve refund (distinct finance actor)
      parameters:
        - in: path
          name: approvalId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Status approved + SLA due
        '409':
          description: Self-approval denied or not pending
  /v1/ops/refunds/{approvalId}/mock-pay:
    post:
      summary: Local/mock ledger pay for approved refund
      parameters:
        - in: path
          name: approvalId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Status paid
        '409':
          description: Not approved or payment request missing
  /v1/audit/events:
    get:
      summary: List recent audit events (local ops)
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Events array
  /v1/ops/audit/mock-event:
    post:
      summary: Local/mock append audit event
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                target_type:
                  type: string
                target_id:
                  type: string
                reason:
                  type: string
      responses:
        '201':
          description: Event appended
        '403':
          description: Mock ops disabled
  /v1/exports:
    get:
      summary: List export requests (ciphertext never returned)
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Exports array
  /v1/ops/exports/mock-create:
    post:
      summary: Local/mock encrypted export request
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                export_type:
                  type: string
                reason:
                  type: string
      responses:
        '201':
          description: Export created (pending)
        '403':
          description: Mock ops disabled
  /v1/ops/exports/{exportId}/approve:
    post:
      summary: Local/mock approve export (distinct actor)
      parameters:
        - in: path
          name: exportId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Status approved
        '409':
          description: Self-approval forbidden or not pending
  /v1/ops/exports/{exportId}/mock-download:
    post:
      summary: Local/mock download (increments counter; no ciphertext)
      parameters:
        - in: path
          name: exportId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Download recorded
        '409':
          description: Not ready / expired / limit
  /v1/notifications:
    get:
      summary: List notification inbox + outbox (local ops)
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Inbox and outbox arrays
  /v1/ops/notifications/mock-enqueue:
    post:
      summary: Local/mock enqueue inbox + outbox (memory provider)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                body:
                  type: string
                template:
                  type: string
                channel:
                  type: string
      responses:
        '201':
          description: Enqueued
        '403':
          description: Mock ops disabled
  /v1/ops/notifications/mock-process:
    post:
      summary: Local/mock process due outbox jobs
      responses:
        '200':
          description: Outbox processed
        '403':
          description: Mock ops disabled
  /v1/ops/notifications/inbox/{inboxId}/mark-read:
    post:
      summary: Local/mock mark inbox message read
      parameters:
        - in: path
          name: inboxId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Marked read
        '403':
          description: Mock ops disabled
        '404':
          description: Inbox not found
  /v1/integrations:
    get:
      summary: Integration Center status (mode flags, checklist, EGO store rows)
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Mode flags + checklist + store EGO rows
  /v1/ops/integrations/ego/mock-ensure:
    post:
      summary: Local/mock ensure disabled EGO profiles for active stores
      responses:
        '200':
          description: Profiles ensured (disabled)
        '403':
          description: Mock ops disabled
  /v1/staff:
    get:
      summary: Role catalog defaults + staff directory (read-only local ops)
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Roles array + staff directory
  /v1/reports/dashboard:
    get:
      summary: Live dashboard KPIs (local ops)
      parameters:
        - in: query
          name: store_id
          schema:
            type: string
      responses:
        '200':
          description: KPI object
        '403':
          description: Forbidden for actor roles
  /v1/reports/payments/reconcile:
    get:
      summary: Payment request vs allocation/receipt reconcile
      responses:
        '200':
          description: Reconcile summary
        '403':
          description: Forbidden for actor roles
  /v1/backups:
    get:
      summary: List backup jobs + alerts (local ops)
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Jobs and alerts arrays
  /v1/ops/backups/mock-run:
    post:
      summary: Local/mock encrypted backup job
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                job_type:
                  type: string
                  enum: [daily_critical, weekly_full, pre_migration]
                fail:
                  type: boolean
      responses:
        '201':
          description: Backup job recorded
        '403':
          description: Mock ops disabled
  /v1/ops/backups/{jobId}/verify:
    post:
      summary: Local/mock checksum verify
      parameters:
        - in: path
          name: jobId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Checksum ok
        '409':
          description: Not completed / mismatch
  /v1/ops/backups/{jobId}/restore-drill:
    post:
      summary: Local/mock restore drill evidence
      parameters:
        - in: path
          name: jobId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Drill evidence
        '409':
          description: Backup not ready
  /v1/search/catalog:
    get:
      summary: Catalog match by OCR text q and/or barcode
      parameters:
        - in: query
          name: q
          schema:
            type: string
        - in: query
          name: barcode
          schema:
            type: string
      responses:
        '200':
          description: Matches array
        '400':
          description: Missing q and barcode
  /v1/search/image:
    post:
      summary: Upload search image metadata and return catalog matches
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                contentType:
                  type: string
                byteSize:
                  type: integer
                consentSearchOnly:
                  type: boolean
                ocrText:
                  type: string
                barcodeValue:
                  type: string
      responses:
        '201':
          description: Upload recorded + matches
        '400':
          description: Consent / type / size invalid
  /v1/search/uploads:
    get:
      summary: List recent search image uploads (local ops)
      responses:
        '200':
          description: Uploads array
  /v1/ops/search/purge-expired:
    post:
      summary: Local/mock purge expired search uploads
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                now:
                  type: string
                  format: date-time
      responses:
        '200':
          description: Purge counts
        '403':
          description: Mock ops disabled
  /v1/me/privacy:
    get:
      summary: Customer privacy profile + addresses
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profile and addresses
        '401':
          description: Unauthorized
  /v1/me/addresses:
    post:
      summary: Add customer address
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Address created
        '401':
          description: Unauthorized
  /v1/me/marketing-opt-in:
    post:
      summary: Set marketing opt-in
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profile updated
  /v1/me/deletion-request:
    post:
      summary: Request account deletion
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Deletion pending
  /v1/privacy/deletion-requests:
    get:
      summary: List account deletion requests (local ops)
      responses:
        '200':
          description: Requests array
  /v1/ops/privacy/deletion-requests/{requestId}/approve:
    post:
      summary: Approve deletion and anonymize identity
      parameters:
        - in: path
          name: requestId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Anonymized
        '409':
          description: Not pending
  /v1/reviews:
    get:
      summary: List product reviews
      parameters:
        - in: query
          name: productId
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
      responses:
        '200':
          description: Reviews array
    post:
      summary: Create verified-purchase review
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Review created
        '401':
          description: Unauthorized
        '409':
          description: Not delivered or window exceeded
  /v1/tiktok-links:
    get:
      summary: List TikTok link submissions
      responses:
        '200':
          description: Links array
    post:
      summary: Customer submit TikTok URL
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Link submitted
        '401':
          description: Unauthorized
  /v1/ops/reviews/mock-create:
    post:
      summary: Local mock delivered order + verified review
      responses:
        '201':
          description: Review created
        '403':
          description: Mock ops disabled
  /v1/ops/tiktok-links/mock-submit:
    post:
      summary: Local mock TikTok submit
      responses:
        '201':
          description: Link created
        '403':
          description: Mock ops disabled
  /v1/ops/tiktok-links/{linkId}/moderate:
    post:
      summary: Approve or reject TikTok link
      parameters:
        - in: path
          name: linkId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Moderated
        '403':
          description: Mock ops disabled
  /v1/orders/{parentId}:
    get:
      summary: Order views for owning customer
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: parentId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Combined + by-store views
        '403':
          description: Not owner
        '404':
          description: Missing
  /v1/orders/{parentId}/cancel:
    post:
      summary: Cancel order (or store child) before courier handoff
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: parentId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Cancelled children + released reservations
        '409':
          description: After handoff — use refusal/return workflow
  /v1/orders/{parentId}/confirm-children:
    post:
      summary: Local/mock supplier confirm for child orders
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: parentId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Children confirmed
        '403':
          description: Mock ops disabled or not owner
        '409':
          description: Transition forbidden
  /v1/orders/{parentId}/payments/qr:
    post:
      summary: Create QR payment request for confirmed children and reserve stock
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: parentId
          required: true
          schema:
            type: string
      responses:
        '201':
          description: QR created with reservations[]
        '409':
          description: Requires supplier confirmation or insufficient_available
  /v1/orders/{parentId}/payments/cod:
    post:
      summary: Create COD shipments for confirmed children and reserve stock
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: parentId
          required: true
          schema:
            type: string
      responses:
        '201':
          description: COD shipments + reservations
        '409':
          description: Requires confirmation, COD ineligible, or insufficient stock
  /v1/cod/shipments:
    get:
      summary: List COD shipments (local ops)
      responses:
        '200':
          description: Shipments with balance due
  /v1/cod/shipments/{codShipmentId}/mock-remit:
    post:
      summary: Local/mock courier remittance + COD reconcile
      parameters:
        - in: path
          name: codShipmentId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Remitted + reconcile totals
        '403':
          description: Mock ops disabled
        '409':
          description: Shipment failed
  /v1/payments/{paymentRequestId}:
    get:
      summary: Payment request status
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: paymentRequestId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Payment DTO
  /v1/payments/{paymentRequestId}/mock-confirm:
    post:
      summary: Local/mock evidence submit + confirm
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: paymentRequestId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Marked paid
        '403':
          description: Mock ops disabled
  /v1/payments/mock-expire-due:
    post:
      summary: Local/mock expire open QR past deadline, release reservations, cancel awaiting children
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                now:
                  type: string
                  format: date-time
      responses:
        '200':
          description: Expired payments + reservation releases
        '403':
          description: Mock ops disabled
  /v1/orders/{parentId}/fulfillment/mock-advance:
    post:
      summary: Local/mock advance paid children through packing to in_transit (consumes reservations at handoff)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: parentId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Per-child steps + updated order views
        '403':
          description: Mock ops disabled or not owner
  /v1/orders/{parentId}/fulfillment/mock-deliver:
    post:
      summary: Local/mock POD + mark in_transit children delivered
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: parentId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Per-child POD steps + updated order views
        '403':
          description: Mock ops disabled or not owner
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
