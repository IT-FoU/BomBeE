openapi: 3.0.3
info:
  title: BomBee Market API
  version: 0.12.0
  description: Phase 2 partial OpenAPI — auth + health. Expand as HTTP surface grows.
servers:
  - url: http://localhost:8787
    description: Local mock (PGlite + mock SMS)
paths:
  /health:
    get:
      summary: Health
      responses:
        '200':
          description: OK
  /v1/auth/capabilities:
    get:
      summary: Auth capability flags
      responses:
        '200':
          description: Capability document
  /v1/auth/otp/request:
    post:
      summary: Request SMS OTP (mock SMS in local)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phoneE164]
              properties:
                phoneE164:
                  type: string
                  example: '+8562012345678'
                purpose:
                  type: string
                  enum: [customer_login, staff_login]
                inviteCode:
                  type: string
                  description: Required when INVITE_ONLY_ENABLED=true
      responses:
        '200':
          description: Accepted (anti-enumeration). Local mock may include devCode.
        '400':
          description: Invalid phone
        '403':
          description: Invite required/invalid
  /v1/auth/otp/verify:
    post:
      summary: Verify OTP and create session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phoneE164, code]
              properties:
                phoneE164:
                  type: string
                code:
                  type: string
                purpose:
                  type: string
                  enum: [customer_login, staff_login]
                inviteCode:
                  type: string
                  description: Required when INVITE_ONLY_ENABLED; redeems invite on success
      responses:
        '200':
          description: Session issued
        '401':
          description: Invalid/expired OTP
        '403':
          description: Invite required/invalid
  /v1/auth/me:
    get:
      summary: Current session profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Session + identity summary
        '401':
          description: Missing or invalid session
  /v1/auth/logout:
    post:
      summary: Revoke session
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                sessionToken:
                  type: string
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Session revoked
        '400':
          description: Missing token
  /v1/invites:
    get:
      summary: List beta invites (local ops)
      responses:
        '200':
          description: Invite rows
    post:
      summary: Create beta invite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inviteCode]
              properties:
                inviteCode:
                  type: string
                intendedRole:
                  type: string
                  enum: [customer, store_owner, ops, admin]
                maxUses:
                  type: integer
                note:
                  type: string
                phoneE164:
                  type: string
      responses:
        '201':
          description: Invite created
        '400':
          description: Invalid payload
        '409':
          description: Code taken
  /v1/stores:
    get:
      summary: List stores (local ops)
      responses:
        '200':
          description: Store rows
    post:
      summary: Create store draft (onboarding)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                code:
                  type: string
      responses:
        '201':
          description: Store created
        '400':
          description: Invalid payload
        '409':
          description: Code taken
  /v1/catalog/categories:
    get:
      summary: List non-prohibited categories
      responses:
        '200':
          description: Category rows
  /v1/catalog/products:
    get:
      summary: List active products with approved prices
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            maximum: 100
      responses:
        '200':
          description: Product browse DTOs (includes availableQty from local stock seed)
  /v1/inventory/stock:
    get:
      summary: Stock balances for a variant
      parameters:
        - in: query
          name: variantId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: availableQty + balances
        '400':
          description: Missing variantId
  /v1/carts:
    post:
      summary: Create cart for customer session
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Cart created
        '401':
          description: Unauthorized
  /v1/carts/{cartId}/items:
    post:
      summary: Upsert cart line
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: cartId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [storeId, variantId, quantity]
              properties:
                storeId:
                  type: string
                variantId:
                  type: string
                quantity:
                  type: integer
      responses:
        '200':
          description: Line upserted
        '400':
          description: Invalid line
        '403':
          description: Cart not owned
  /v1/carts/{cartId}/checkout:
    post:
      summary: Checkout cart into parent/child orders (no payment)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: cartId
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                shippingLakByStore:
                  type: object
                  additionalProperties:
                    type: integer
      responses:
        '201':
          description: Order created
        '409':
          description: Domain conflict (empty cart, inactive variant, store closed, …)
  /v1/orders:
    get:
      summary: List recent parent orders with child summaries (local ops)
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Orders array
  /v1/ops/orders/{parentId}/confirm-children:
    post:
      summary: Local ops supplier confirm (no customer session)
      parameters:
        - in: path
          name: parentId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Confirmed child ids + refreshed orders list
        '403':
          description: Mock ops disabled
  /v1/ops/orders/{parentId}/fulfillment/mock-advance:
    post:
      summary: Local ops advance to in_transit
      parameters:
        - in: path
          name: parentId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Advance steps + orders list
  /v1/ops/orders/{parentId}/fulfillment/mock-deliver:
    post:
      summary: Local ops POD deliver
      parameters:
        - in: path
          name: parentId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deliver steps + orders list
  /v1/settlements:
    get:
      summary: List settlement batches (local ops)
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Batches array
  /v1/ops/settlements/mock-create:
    post:
      summary: Local/mock draft settlement batch for delivered+paid children
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                store_id:
                  type: string
      responses:
        '201':
          description: Draft batch created
        '403':
          description: Mock ops disabled
        '409':
          description: No eligible orders or payout missing/on hold
  /v1/settlements/{batchId}/lines:
    get:
      summary: Settlement lines for a batch
      parameters:
        - in: path
          name: batchId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Lines array
        '404':
          description: Batch not found
  /v1/ops/settlements/{batchId}/submit:
    post:
      summary: Local/mock submit draft batch for approval
      parameters:
        - in: path
          name: batchId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Status pending_approval
        '409':
          description: Batch not submittable
  /v1/ops/settlements/{batchId}/approve:
    post:
      summary: Local/mock approve batch (distinct finance actor)
      parameters:
        - in: path
          name: batchId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Status approved
        '409':
          description: Self-approval denied or not approvable
  /v1/ops/settlements/{batchId}/dispute:
    post:
      summary: Local/mock dispute a settlement line
      parameters:
        - in: path
          name: batchId
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                child_order_id:
                  type: string
                reason:
                  type: string
      responses:
        '200':
          description: Line disputed; batch partially_disputed
        '409':
          description: Dispute window exceeded
  /v1/support/tickets:
    get:
      summary: List support tickets (local ops)
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Tickets array
  /v1/ops/support/tickets/mock-create:
    post:
      summary: Local/mock open a support ticket
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                subject:
                  type: string
                body:
                  type: string
                urgency:
                  type: string
                  enum: [general, urgent]
      responses:
        '201':
          description: Ticket opened
        '403':
          description: Mock ops disabled
  /v1/ops/support/tickets/{ticketId}/reply:
    post:
      summary: Local/mock staff reply
      parameters:
        - in: path
          name: ticketId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body:
                  type: string
      responses:
        '200':
          description: Status awaiting_customer
        '404':
          description: Ticket not found
  /v1/ops/support/tickets/{ticketId}/resolve:
    post:
      summary: Local/mock preliminary resolve
      parameters:
        - in: path
          name: ticketId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Status resolved_pending_confirm
        '404':
          description: Ticket not found
  /v1/orders/{parentId}:
    get:
      summary: Order views for owning customer
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: parentId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Combined + by-store views
        '403':
          description: Not owner
        '404':
          description: Missing
  /v1/orders/{parentId}/cancel:
    post:
      summary: Cancel order (or store child) before courier handoff
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: parentId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Cancelled children + released reservations
        '409':
          description: After handoff — use refusal/return workflow
  /v1/orders/{parentId}/confirm-children:
    post:
      summary: Local/mock supplier confirm for child orders
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: parentId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Children confirmed
        '403':
          description: Mock ops disabled or not owner
        '409':
          description: Transition forbidden
  /v1/orders/{parentId}/payments/qr:
    post:
      summary: Create QR payment request for confirmed children and reserve stock
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: parentId
          required: true
          schema:
            type: string
      responses:
        '201':
          description: QR created with reservations[]
        '409':
          description: Requires supplier confirmation or insufficient_available
  /v1/orders/{parentId}/payments/cod:
    post:
      summary: Create COD shipments for confirmed children and reserve stock
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: parentId
          required: true
          schema:
            type: string
      responses:
        '201':
          description: COD shipments + reservations
        '409':
          description: Requires confirmation, COD ineligible, or insufficient stock
  /v1/cod/shipments:
    get:
      summary: List COD shipments (local ops)
      responses:
        '200':
          description: Shipments with balance due
  /v1/cod/shipments/{codShipmentId}/mock-remit:
    post:
      summary: Local/mock courier remittance + COD reconcile
      parameters:
        - in: path
          name: codShipmentId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Remitted + reconcile totals
        '403':
          description: Mock ops disabled
        '409':
          description: Shipment failed
  /v1/payments/{paymentRequestId}:
    get:
      summary: Payment request status
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: paymentRequestId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Payment DTO
  /v1/payments/{paymentRequestId}/mock-confirm:
    post:
      summary: Local/mock evidence submit + confirm
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: paymentRequestId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Marked paid
        '403':
          description: Mock ops disabled
  /v1/payments/mock-expire-due:
    post:
      summary: Local/mock expire open QR past deadline, release reservations, cancel awaiting children
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                now:
                  type: string
                  format: date-time
      responses:
        '200':
          description: Expired payments + reservation releases
        '403':
          description: Mock ops disabled
  /v1/orders/{parentId}/fulfillment/mock-advance:
    post:
      summary: Local/mock advance paid children through packing to in_transit (consumes reservations at handoff)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: parentId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Per-child steps + updated order views
        '403':
          description: Mock ops disabled or not owner
  /v1/orders/{parentId}/fulfillment/mock-deliver:
    post:
      summary: Local/mock POD + mark in_transit children delivered
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: parentId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Per-child POD steps + updated order views
        '403':
          description: Mock ops disabled or not owner
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
